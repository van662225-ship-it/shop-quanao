<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đầm Đen Tiểu Thư</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    /* Làm nền trong suốt hoàn toàn */
    background: transparent; 
    padding: 0;
    overflow: hidden;
}

.container{
    max-width: 100%;
    margin: 0;
    display: flex;
    gap: 15px;
    align-items: flex-start;
    background: transparent;
}

.gallery{
    display: flex;
    gap: 8px;
}

.thumbnails{
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.thumbnails img{
    width: 60px;
    height: 78px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 4px;
    transition: 0.2s;
}

.thumbnails img.active{
    border: 2px solid #000;
}

.main-image img{
    width: 280px;
    height: 370px;
    object-fit: cover;
    border-radius: 6px;
}

.info{
    flex: 1;
    padding-top: 5px;
}

.size-title{
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
    color: #333;
}

.sizes{
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.size-btn{
    width: 40px;
    height: 36px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
    font-weight: bold;
    border-radius: 4px;
    font-size: 13px;
    transition: 0.1s;
}

.size-btn.active{
    background: black;
    color: white;
    border-color: black;
}

.buy-btn{
    background: black;
    color: white;
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 4px;
    width: 100%;
    max-width: 200px;
    font-size: 14px;
}

.buy-btn:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">

    <div class="gallery">
        <div class="thumbnails">
            <img src="arnh 1.jpg" class="thumb active" onclick="changeImage(this)">
            <img src="anh2.jpg" class="thumb" onclick="changeImage(this)">
            <img src="anh3.jpg" class="thumb" onclick="changeImage(this)">
            <img src="anhr4.jpg" class="thumb" onclick="changeImage(this)">
        </div>

        <div class="main-image">
            <img id="mainImg" src="arnh 1.jpg">
        </div>
    </div>

    <div class="info">
        <div class="size-title">Chọn Size:</div>
        <div class="sizes">
            <button class="size-btn" onclick="selectSize(this)">S</button>
            <button class="size-btn" onclick="selectSize(this)">M</button>
            <button class="size-btn" onclick="selectSize(this)">L</button>
            <button class="size-btn" onclick="selectSize(this)">XL</button>
        </div>

        <button class="buy-btn">
            🛒 MUA NGAY
        </button>
    </div>

</div>

<script>
function changeImage(img){
    document.getElementById("mainImg").src = img.src;
    document.querySelectorAll(".thumb").forEach(item=>{
        item.classList.remove("active");
    });
    img.classList.add("active");
}

function selectSize(btn){
    document.querySelectorAll(".size-btn").forEach(item=>{
        item.classList.remove("active");
    });
    btn.classList.add("active");
}
</script>

</body>
</html>
